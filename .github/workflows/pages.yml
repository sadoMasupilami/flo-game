# Testet das Spiel automatisch und veröffentlicht es danach auf GitHub Pages.
# Schlägt der Test fehl, bleibt die alte Version online.
name: Testen und veröffentlichen

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Bilder vom Test aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-bilder
          path: test-output
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html sw.js js icons manifest.webmanifest _site/
          # neuer Name für den Offline-Speicher bei jeder Version
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
